<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Breathe — Calm Your Nervous System</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Breathe">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#0f1419">
    <link rel="apple-touch-icon" href="/icon-192.svg">
    <style>
        :root {
            --bg: #0f1419; --surface: #1a2028; --surface2: #232d38;
            --accent: #4fc3f7; --accent2: #81d4fa; --warm: #ffab91;
            --text: #e0e6ed; --text-dim: #8899a6;
            --exhale: #80cbc4; --inhale: #4fc3f7; --hold: #ce93d8; --rest: #ffcc80;
            --success: #a5d6a7; --radius: 12px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            line-height: 1.6;
            padding-top: env(safe-area-inset-top);
            min-height: 100vh;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }

        /* Header */
        header { text-align: center; margin-bottom: 30px; }
        header h1 {
            font-size: 2.2em;
            font-weight: 300;
            color: var(--accent);
            margin-bottom: 8px;
        }
        header .subtitle {
            color: var(--text-dim);
            font-size: 0.95em;
            max-width: 500px;
            margin: 0 auto;
        }

        /* Reminder bar */
        .reminder-bar {
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 10px;
            background: var(--surface);
            border-radius: var(--radius);
            padding: 12px 16px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .reminder-bar select {
            background: var(--surface2);
            color: var(--text);
            border: 1px solid var(--surface2);
            border-radius: 8px;
            padding: 8px 12px;
            font-size: 0.9em;
            outline: none;
        }
        .reminder-bar button {
            background: var(--surface2);
            color: var(--text);
            border: none;
            border-radius: 8px;
            padding: 8px 16px;
            cursor: pointer;
            font-size: 0.9em;
            transition: background 0.2s;
        }
        .reminder-bar button:hover { background: var(--accent); color: var(--bg); }
        .reminder-bar button.active { background: var(--accent); color: var(--bg); }
        .reminder-status { color: var(--text-dim); font-size: 0.85em; }
        .reminder-status.active { color: var(--accent); }

        /* Daily tracker */
        .daily-tracker {
            background: var(--surface);
            border-radius: var(--radius);
            padding: 14px 16px;
            margin-bottom: 24px;
        }
        .daily-tracker .tracker-label {
            font-size: 0.85em;
            color: var(--text-dim);
            margin-bottom: 8px;
        }
        .tracker-dots {
            display: flex;
            flex-direction: row;
            gap: 8px;
            margin-bottom: 6px;
        }
        .tracker-dot {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: var(--surface2);
            transition: background 0.3s;
        }
        .tracker-dot.done { background: var(--success); }
        .tracker-stat { font-size: 0.8em; color: var(--text-dim); }

        /* Technique cards */
        .techniques-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 16px;
            margin-bottom: 30px;
        }
        .technique-card {
            background: var(--surface);
            border: 2px solid transparent;
            border-radius: var(--radius);
            padding: 20px;
            cursor: pointer;
            transition: border-color 0.2s, transform 0.15s;
        }
        .technique-card:hover { border-color: var(--accent); transform: translateY(-2px); }
        .technique-card.selected { border-color: var(--accent); background: var(--surface2); }
        .technique-card h3 {
            font-size: 1.1em;
            color: var(--accent2);
            margin-bottom: 8px;
        }
        .technique-card p {
            font-size: 0.88em;
            color: var(--text-dim);
            margin-bottom: 12px;
            line-height: 1.5;
        }
        .technique-card .steps-row {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 10px;
        }
        .step-badge {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 0.78em;
            font-weight: 600;
        }
        .step-badge.Inhale { background: rgba(79, 195, 247, 0.15); color: var(--inhale); }
        .step-badge.Exhale { background: rgba(128, 203, 196, 0.15); color: var(--exhale); }
        .step-badge.Hold { background: rgba(206, 147, 216, 0.15); color: var(--hold); }
        .step-badge.Rest { background: rgba(255, 204, 128, 0.15); color: var(--rest); }
        .technique-card .benefit {
            font-size: 0.8em;
            color: var(--warm);
            font-style: italic;
        }

        /* Exercise area */
        .exercise-area {
            display: none;
            text-align: center;
            margin-bottom: 30px;
        }
        .exercise-area.active { display: block; }
        .exercise-area .exercise-title {
            font-size: 1.3em;
            color: var(--accent2);
            margin-bottom: 6px;
        }
        .exercise-area .cycle-counter {
            font-size: 0.9em;
            color: var(--text-dim);
            margin-bottom: 24px;
        }

        .breath-circle-container {
            position: relative;
            width: 280px;
            height: 280px;
            margin: 0 auto 24px auto;
        }
        .progress-ring {
            position: absolute;
            top: 0; left: 0;
            width: 280px;
            height: 280px;
            transform: rotate(-90deg);
        }
        .progress-ring circle {
            fill: none;
            stroke-width: 4;
            stroke-linecap: round;
            transition: stroke-dashoffset 1s linear, stroke 0.4s;
        }
        .inner-circle {
            position: absolute;
            top: 20px; left: 20px;
            width: 240px;
            height: 240px;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: transform 1s ease-in-out, background 0.5s;
            transform: scale(0.7);
        }
        .inner-circle.phase-Inhale {
            background: radial-gradient(circle, rgba(79, 195, 247, 0.25) 0%, rgba(79, 195, 247, 0.05) 70%);
            transform: scale(1);
        }
        .inner-circle.phase-Exhale {
            background: radial-gradient(circle, rgba(128, 203, 196, 0.25) 0%, rgba(128, 203, 196, 0.05) 70%);
            transform: scale(0.7);
        }
        .inner-circle.phase-Hold {
            background: radial-gradient(circle, rgba(206, 147, 216, 0.25) 0%, rgba(206, 147, 216, 0.05) 70%);
            transform: scale(0.9);
        }
        .inner-circle.phase-Rest {
            background: radial-gradient(circle, rgba(255, 204, 128, 0.25) 0%, rgba(255, 204, 128, 0.05) 70%);
            transform: scale(0.7);
        }
        .inner-circle.phase-ready {
            background: radial-gradient(circle, rgba(79, 195, 247, 0.15) 0%, rgba(79, 195, 247, 0.03) 70%);
            transform: scale(0.8);
        }

        .phase-label {
            font-size: 1.1em;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 4px;
        }
        .phase-label.Inhale { color: var(--inhale); }
        .phase-label.Exhale { color: var(--exhale); }
        .phase-label.Hold { color: var(--hold); }
        .phase-label.Rest { color: var(--rest); }
        .phase-label.ready { color: var(--text-dim); }

        .timer-display {
            font-size: 3em;
            font-weight: 100;
            color: var(--text);
            line-height: 1;
            margin-bottom: 4px;
        }
        .instruction-text {
            font-size: 0.85em;
            color: var(--text-dim);
            max-width: 180px;
        }

        /* Buttons */
        .btn {
            display: inline-block;
            padding: 12px 32px;
            border: none;
            border-radius: 30px;
            font-size: 1em;
            cursor: pointer;
            transition: background 0.2s, transform 0.15s;
            margin: 4px;
        }
        .btn:active { transform: scale(0.96); }
        .btn-primary { background: var(--accent); color: var(--bg); font-weight: 600; }
        .btn-primary:hover { background: var(--accent2); }
        .btn-secondary { background: var(--surface2); color: var(--text); }
        .btn-secondary:hover { background: var(--surface); }
        .exercise-controls { margin-top: 10px; }

        /* Session complete */
        .session-complete {
            display: none;
            text-align: center;
            margin-bottom: 30px;
            background: var(--surface);
            border-radius: var(--radius);
            padding: 30px 20px;
        }
        .session-complete.active { display: block; }
        .session-complete h2 {
            color: var(--success);
            font-weight: 400;
            margin-bottom: 10px;
        }
        .session-complete p {
            color: var(--text-dim);
            margin-bottom: 16px;
        }
        .session-log {
            margin-top: 16px;
            font-size: 0.85em;
            color: var(--text-dim);
        }

        /* Health tips */
        .tips-section {
            margin-bottom: 40px;
        }
        .tips-section h2 {
            font-size: 1.3em;
            font-weight: 400;
            color: var(--accent2);
            margin-bottom: 16px;
        }
        .tip-card {
            background: var(--surface);
            border-radius: var(--radius);
            padding: 18px 20px;
            margin-bottom: 12px;
        }
        .tip-card h4 {
            color: var(--warm);
            font-size: 0.95em;
            margin-bottom: 6px;
        }
        .tip-card p {
            font-size: 0.88em;
            color: var(--text-dim);
            line-height: 1.55;
        }

        /* Notification popup */
        .notification-popup {
            display: none;
            position: fixed;
            top: 20px;
            right: 20px;
            background: var(--surface);
            border: 1px solid var(--accent);
            border-radius: var(--radius);
            padding: 18px 22px;
            z-index: 1000;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            animation: slideIn 0.3s ease-out;
            max-width: 320px;
        }
        .notification-popup.active { display: block; }
        .notification-popup .notif-title {
            font-size: 1em;
            font-weight: 600;
            color: var(--accent);
            margin-bottom: 4px;
        }
        .notification-popup .notif-message {
            font-size: 0.88em;
            color: var(--text-dim);
            margin-bottom: 12px;
        }
        .notification-popup .notif-actions {
            display: flex;
            gap: 8px;
        }
        .notification-popup .notif-actions button {
            padding: 6px 16px;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.85em;
        }
        .notif-btn-primary { background: var(--accent); color: var(--bg); font-weight: 600; }
        .notif-btn-secondary { background: var(--surface2); color: var(--text); }

        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        /* Mobile responsive */
        @media (max-width: 600px) {
            header h1 { font-size: 1.7em; }
            header .subtitle { font-size: 0.85em; }
            .techniques-grid { grid-template-columns: 1fr; }
            .breath-circle-container { width: 220px; height: 220px; }
            .progress-ring { width: 220px; height: 220px; }
            .inner-circle { top: 16px; left: 16px; width: 188px; height: 188px; }
            .timer-display { font-size: 2.4em; }
            .phase-label { font-size: 0.95em; }
            .instruction-text { font-size: 0.78em; max-width: 150px; }
            .container { padding: 14px; }
            .notification-popup { top: 10px; right: 10px; left: 10px; max-width: none; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Breathe</h1>
            <p class="subtitle">Extended exhale breathing to calm your nervous system &amp; warm your extremities</p>
        </header>

        <div class="reminder-bar">
            <select id="reminderInterval">
                <option value="0">Off</option>
                <option value="30">30 min</option>
                <option value="45">45 min</option>
                <option value="60" selected>1 hr</option>
                <option value="90">1.5 hr</option>
                <option value="120">2 hr</option>
            </select>
            <button id="reminderBtn" onclick="toggleReminder()">Start Reminders</button>
            <span id="reminderStatus" class="reminder-status"></span>
        </div>

        <div class="daily-tracker">
            <div class="tracker-label">Today's sessions</div>
            <div class="tracker-dots" id="trackerDots"></div>
            <div class="tracker-stat" id="trackerStat">0/6 goal</div>
        </div>

        <div class="techniques-grid" id="techniquesGrid"></div>

        <div class="exercise-area" id="exerciseArea">
            <div class="exercise-title" id="exerciseTitle"></div>
            <div class="cycle-counter" id="cycleCounter"></div>
            <div class="breath-circle-container">
                <svg class="progress-ring" viewBox="0 0 280 280">
                    <circle id="progressCircle" cx="140" cy="140" r="130" stroke="var(--accent)" stroke-dasharray="817" stroke-dashoffset="817"></circle>
                </svg>
                <div class="inner-circle phase-ready" id="innerCircle">
                    <div class="phase-label ready" id="phaseLabel">Ready</div>
                    <div class="timer-display" id="timerDisplay">--</div>
                    <div class="instruction-text" id="instructionText">Select a technique and press Begin</div>
                </div>
            </div>
            <div class="exercise-controls">
                <button class="btn btn-primary" id="beginBtn" onclick="startExercise()">Begin</button>
                <button class="btn btn-secondary" id="stopBtn" onclick="resetExercise()" style="display:none;">Stop</button>
            </div>
        </div>

        <div class="session-complete" id="sessionComplete">
            <h2>Session Complete</h2>
            <p id="completionMessage"></p>
            <button class="btn btn-primary" onclick="doAnother()">Do Another</button>
            <div class="session-log" id="sessionLog"></div>
        </div>

        <div class="tips-section" id="tipsSection">
            <h2>Why This Works</h2>
        </div>
    </div>

    <div class="notification-popup" id="notificationPopup">
        <div class="notif-title">Time to breathe</div>
        <div class="notif-message">A quick breathing session will help calm your nervous system and warm your extremities.</div>
        <div class="notif-actions">
            <button class="notif-btn-primary" onclick="notifStartNow()">Start Now</button>
            <button class="notif-btn-secondary" onclick="notifLater()">Later</button>
        </div>
    </div>

    <script>
        /* ================================================
           DATA
           ================================================ */
        const techniques = {
            calm_exhale: {
                name: "Calm Exhale (4-2-8)",
                description: "Extended exhale activates your vagus nerve, shifting your nervous system into rest-and-digest mode. Improves circulation to extremities and reduces anxiety.",
                steps: [
                    {phase: "Inhale", duration: 4, instruction: "Breathe in slowly through your nose"},
                    {phase: "Hold", duration: 2, instruction: "Gentle pause"},
                    {phase: "Exhale", duration: 8, instruction: "Slow, steady exhale through pursed lips"}
                ],
                cycles: 6,
                benefit: "Longest exhale ratio \u2014 maximizes vagal tone and calms cold extremities"
            },
            relaxing_478: {
                name: "4-7-8 Relaxing Breath",
                description: "Dr. Andrew Weil\u2019s technique. The extended hold saturates blood with oxygen, and the long exhale relaxes smooth muscle in blood vessels, warming your hands and feet.",
                steps: [
                    {phase: "Inhale", duration: 4, instruction: "Inhale quietly through your nose"},
                    {phase: "Hold", duration: 7, instruction: "Hold your breath gently"},
                    {phase: "Exhale", duration: 8, instruction: "Exhale completely through your mouth"}
                ],
                cycles: 4,
                benefit: "Natural tranquilizer for the nervous system \u2014 do this 2x daily minimum"
            },
            box_extended: {
                name: "Extended Box (4-4-6-2)",
                description: "A variation of Navy SEAL box breathing modified with a longer exhale. Balances focus with calm \u2014 good for work sessions.",
                steps: [
                    {phase: "Inhale", duration: 4, instruction: "Steady breath in through the nose"},
                    {phase: "Hold", duration: 4, instruction: "Hold at the top"},
                    {phase: "Exhale", duration: 6, instruction: "Slow controlled exhale"},
                    {phase: "Rest", duration: 2, instruction: "Empty pause before next breath"}
                ],
                cycles: 5,
                benefit: "Great for focus + calm during work \u2014 exhale is still longer than the inhale"
            },
            coherent: {
                name: "Coherent Breathing (5-5)",
                description: "Breathing at ~6 breaths per minute synchronizes heart rate variability (HRV). Higher HRV = better blood flow regulation and warmer extremities.",
                steps: [
                    {phase: "Inhale", duration: 5, instruction: "Smooth, even inhale"},
                    {phase: "Exhale", duration: 5, instruction: "Smooth, even exhale \u2014 relax shoulders and jaw"}
                ],
                cycles: 8,
                benefit: "Optimizes heart rate variability \u2014 the #1 metric for nervous system health"
            }
        };

        const healthTips = [
            {title: "Why longer exhales warm your hands & feet", body: "When you exhale longer than you inhale, you stimulate the vagus nerve. This shifts your autonomic nervous system from sympathetic (fight-or-flight, which constricts blood vessels in extremities) to parasympathetic (rest-and-digest, which dilates them). More blood flows to your fingers and toes."},
            {title: "Cold extremities = nervous system signal", body: "Cold hands and feet are often caused by vasoconstriction from chronic sympathetic nervous system activation (stress/anxiety). It\u2019s your body redirecting blood to vital organs. Extended exhale breathing directly counteracts this."},
            {title: "The 2x daily minimum", body: "Research shows that just 5 minutes of extended-exhale breathing twice daily can measurably improve heart rate variability within 2 weeks. Morning and mid-afternoon are ideal \u2014 that\u2019s when cortisol naturally spikes."},
            {title: "Nose breathing matters", body: "Breathing through your nose produces nitric oxide, a vasodilator that opens blood vessels and improves circulation. Mouth breathing skips this. Always inhale through your nose during these exercises."},
            {title: "The vagus nerve connection", body: "The vagus nerve runs from your brainstem to your gut. Long exhales increase vagal tone, which lowers heart rate, reduces inflammation, improves digestion, and relaxes smooth muscle in blood vessel walls, allowing more blood to reach your extremities."},
            {title: "Breathing before meals", body: "Doing 2 minutes of extended-exhale breathing before eating shifts your body into parasympathetic mode, improving digestion and nutrient absorption. Your body can\u2019t properly digest in fight-or-flight mode."},
            {title: "Stack it with movement", body: "After a breathing session, gently shake your hands and feet for 30 seconds. The combination of vasodilation from breathing + mechanical movement pumps blood into extremities faster."}
        ];

        /* ================================================
           STATE
           ================================================ */
        let selectedTechnique = null;
        let currentStepIndex = 0;
        let currentCycle = 0;
        let secondsLeft = 0;
        let exerciseTimer = null;
        let isRunning = false;
        let reminderTimer = null;
        let reminderActive = false;
        const GOAL = 6;

        /* ================================================
           RENDER TECHNIQUES
           ================================================ */
        function renderTechniques() {
            const grid = document.getElementById('techniquesGrid');
            let html = '';
            for (const [key, tech] of Object.entries(techniques)) {
                const stepsHtml = tech.steps.map(function(s) {
                    return '<span class="step-badge ' + s.phase + '">' + s.phase + ' ' + s.duration + 's</span>';
                }).join('');
                html += '<div class="technique-card" data-key="' + key + '" onclick="selectTechnique(\'' + key + '\')">' +
                    '<h3>' + tech.name + '</h3>' +
                    '<p>' + tech.description + '</p>' +
                    '<div class="steps-row">' + stepsHtml + '</div>' +
                    '<div class="benefit">' + tech.benefit + '</div>' +
                    '</div>';
            }
            grid.innerHTML = html;
        }

        /* ================================================
           RENDER TIPS
           ================================================ */
        function renderTips() {
            const section = document.getElementById('tipsSection');
            let html = '<h2>Why This Works</h2>';
            healthTips.forEach(function(tip) {
                html += '<div class="tip-card">' +
                    '<h4>' + tip.title + '</h4>' +
                    '<p>' + tip.body + '</p>' +
                    '</div>';
            });
            section.innerHTML = html;
        }

        /* ================================================
           SELECT TECHNIQUE
           ================================================ */
        function selectTechnique(key) {
            selectedTechnique = key;
            document.querySelectorAll('.technique-card').forEach(function(card) {
                card.classList.toggle('selected', card.dataset.key === key);
            });
            var tech = techniques[key];
            var area = document.getElementById('exerciseArea');
            area.classList.add('active');
            document.getElementById('exerciseTitle').textContent = tech.name;
            document.getElementById('cycleCounter').textContent = tech.cycles + ' cycles';
            resetCircle();
            document.getElementById('sessionComplete').classList.remove('active');
            area.scrollIntoView({behavior: 'smooth', block: 'start'});
        }

        /* ================================================
           EXERCISE LOGIC
           ================================================ */
        function startExercise() {
            if (!selectedTechnique) return;
            isRunning = true;
            currentCycle = 0;
            currentStepIndex = 0;
            document.getElementById('beginBtn').style.display = 'none';
            document.getElementById('stopBtn').style.display = 'inline-block';
            document.getElementById('sessionComplete').classList.remove('active');
            advanceStep();
        }

        function advanceStep() {
            var tech = techniques[selectedTechnique];
            if (currentStepIndex >= tech.steps.length) {
                currentStepIndex = 0;
                currentCycle++;
                if (currentCycle >= tech.cycles) {
                    completeExercise();
                    return;
                }
            }
            var step = tech.steps[currentStepIndex];
            secondsLeft = step.duration;
            updateCycleCounter();
            runStep(step);
        }

        function runStep(step) {
            var circle = document.getElementById('innerCircle');
            var phaseLabel = document.getElementById('phaseLabel');
            var timerDisplay = document.getElementById('timerDisplay');
            var instructionText = document.getElementById('instructionText');
            var progressCircle = document.getElementById('progressCircle');

            // Update phase display
            circle.className = 'inner-circle phase-' + step.phase;
            phaseLabel.className = 'phase-label ' + step.phase;
            phaseLabel.textContent = step.phase;
            timerDisplay.textContent = secondsLeft;
            instructionText.textContent = step.instruction;

            // Progress ring
            var circumference = 2 * Math.PI * 130; // ~817
            progressCircle.style.stroke = 'var(--' + step.phase.toLowerCase() + ')';
            progressCircle.style.strokeDasharray = circumference;
            progressCircle.style.strokeDashoffset = 0;

            var totalDuration = step.duration;

            if (exerciseTimer) clearInterval(exerciseTimer);
            exerciseTimer = setInterval(function() {
                tick(totalDuration, circumference);
            }, 1000);
        }

        function tick(totalDuration, circumference) {
            secondsLeft--;
            document.getElementById('timerDisplay').textContent = Math.max(secondsLeft, 0);

            // Update progress ring
            var progress = secondsLeft / totalDuration;
            document.getElementById('progressCircle').style.strokeDashoffset = circumference * (1 - progress);

            if (secondsLeft <= 0) {
                clearInterval(exerciseTimer);
                exerciseTimer = null;
                currentStepIndex++;
                if (isRunning) advanceStep();
            }
        }

        function updateCycleCounter() {
            var tech = techniques[selectedTechnique];
            document.getElementById('cycleCounter').textContent = 'Cycle ' + (currentCycle + 1) + ' of ' + tech.cycles;
        }

        function completeExercise() {
            isRunning = false;
            if (exerciseTimer) { clearInterval(exerciseTimer); exerciseTimer = null; }

            var tech = techniques[selectedTechnique];
            var totalSeconds = tech.steps.reduce(function(sum, s) { return sum + s.duration; }, 0) * tech.cycles;
            var minutes = Math.round(totalSeconds / 60 * 10) / 10;

            document.getElementById('exerciseArea').classList.remove('active');
            var complete = document.getElementById('sessionComplete');
            complete.classList.add('active');
            document.getElementById('completionMessage').textContent =
                'You completed ' + tech.cycles + ' cycles of ' + tech.name + ' (' + minutes + ' min). Your nervous system thanks you.';

            var now = new Date();
            document.getElementById('sessionLog').textContent =
                'Completed at ' + now.toLocaleTimeString() + ' on ' + now.toLocaleDateString();

            // Update daily tracker
            addSessionToday();
            renderTracker();
            complete.scrollIntoView({behavior: 'smooth', block: 'start'});
        }

        function resetExercise() {
            isRunning = false;
            if (exerciseTimer) { clearInterval(exerciseTimer); exerciseTimer = null; }
            resetCircle();
            document.getElementById('beginBtn').style.display = 'inline-block';
            document.getElementById('stopBtn').style.display = 'none';
        }

        function resetCircle() {
            var circle = document.getElementById('innerCircle');
            circle.className = 'inner-circle phase-ready';
            document.getElementById('phaseLabel').className = 'phase-label ready';
            document.getElementById('phaseLabel').textContent = 'Ready';
            document.getElementById('timerDisplay').textContent = '--';
            document.getElementById('instructionText').textContent = 'Press Begin to start';
            document.getElementById('progressCircle').style.strokeDashoffset = 817;
            document.getElementById('beginBtn').style.display = 'inline-block';
            document.getElementById('stopBtn').style.display = 'none';
        }

        function doAnother() {
            document.getElementById('sessionComplete').classList.remove('active');
            if (selectedTechnique) {
                selectTechnique(selectedTechnique);
            }
        }

        /* ================================================
           REMINDERS
           ================================================ */
        function toggleReminder() {
            var btn = document.getElementById('reminderBtn');
            var status = document.getElementById('reminderStatus');
            if (reminderActive) {
                clearInterval(reminderTimer);
                reminderTimer = null;
                reminderActive = false;
                btn.textContent = 'Start Reminders';
                btn.classList.remove('active');
                status.textContent = '';
                status.classList.remove('active');
            } else {
                var minutes = parseInt(document.getElementById('reminderInterval').value);
                if (minutes === 0) return;
                reminderActive = true;
                btn.textContent = 'Stop Reminders';
                btn.classList.add('active');
                status.textContent = 'Active \u2014 every ' + minutes + ' min';
                status.classList.add('active');

                // Request notification permission
                if ('Notification' in window && Notification.permission === 'default') {
                    Notification.requestPermission();
                }

                reminderTimer = setInterval(function() {
                    showReminder();
                }, minutes * 60 * 1000);
            }
        }

        function showReminder() {
            // In-page notification
            document.getElementById('notificationPopup').classList.add('active');

            // Browser notification
            if ('Notification' in window && Notification.permission === 'granted') {
                new Notification('Time to breathe', {
                    body: 'A quick breathing session will calm your nervous system and warm your extremities.',
                    icon: '/icon-192.svg'
                });
            }
        }

        function notifStartNow() {
            document.getElementById('notificationPopup').classList.remove('active');
            if (!selectedTechnique) {
                selectTechnique('calm_exhale');
            }
            document.getElementById('exerciseArea').scrollIntoView({behavior: 'smooth'});
        }

        function notifLater() {
            document.getElementById('notificationPopup').classList.remove('active');
        }

        /* ================================================
           DAILY TRACKER (localStorage)
           ================================================ */
        function getTodayKey() {
            return 'breathe_sessions_' + new Date().toISOString().slice(0, 10);
        }

        function getTodayCount() {
            return parseInt(localStorage.getItem(getTodayKey()) || '0');
        }

        function addSessionToday() {
            var count = getTodayCount() + 1;
            localStorage.setItem(getTodayKey(), count);
        }

        function renderTracker() {
            var count = getTodayCount();
            var dots = document.getElementById('trackerDots');
            var html = '';
            for (var i = 0; i < GOAL; i++) {
                html += '<div class="tracker-dot' + (i < count ? ' done' : '') + '"></div>';
            }
            dots.innerHTML = html;
            document.getElementById('trackerStat').textContent = count + '/' + GOAL + ' goal';
        }

        /* ================================================
           INIT
           ================================================ */
        renderTechniques();
        renderTips();
        renderTracker();

        // PWA service worker registration
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js').catch(function() {});
        }
    </script>
</body>
</html>
